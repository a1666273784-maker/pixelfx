<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山海焚天 · 横板 Boss 纯特效演示</title>
<style>
  :root{
    --ink:#0d131b; --ink2:#111a24; --ink3:#18222F; --line:#26313f;
    --bone:#FFF8E7; --gold:#FFD700; --flame:#FF6A00; --crimson:#E62E00;
    --ember:#7A1212; --jade:#2E9E8F; --teal:#16524B;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 60% -10%, #1b2836 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #20161a 0%, transparent 55%),
      var(--ink);
    color:var(--bone);
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--jade)}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:14px 16px 16px;min-height:100%}
  @media (max-width: 900px){ .app{grid-template-columns:1fr} }

  /* ---- header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 10px;grid-column:1/-1}
  .brand{display:flex;align-items:center;gap:10px}
  .sigil{width:26px;height:26px;image-rendering:pixelated;flex:none}
  h1{margin:0;font-size:17px;letter-spacing:.16em;font-weight:600;color:var(--bone)}
  h1 span{color:var(--gold)}
  .sub{margin:3px 0 0;color:#8496a8;font-size:11px;letter-spacing:.14em}
  .pal{display:flex;gap:0;border:1px solid var(--line)}
  .pal i{width:18px;height:18px;display:block}

  /* ---- panels */
  .panel{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid var(--line);padding:10px}
  .panel + .panel{margin-top:12px}
  .panel h2{margin:0 0 8px;font-size:10px;letter-spacing:.22em;color:#7f92a5;font-weight:500;text-transform:uppercase;display:flex;justify-content:space-between}
  .panel h2 b{color:var(--gold);font-weight:500}

  /* ---- effect cards */
  .card{display:flex;gap:10px;width:100%;text-align:left;align-items:center;background:transparent;border:1px solid transparent;border-left:2px solid #22303f;color:var(--bone);padding:8px 8px;cursor:pointer;font-family:var(--mono)}
  .card + .card{margin-top:4px}
  .card:hover{background:rgba(255,255,255,.035)}
  .card.on{background:linear-gradient(90deg,rgba(230,46,0,.16),rgba(230,46,0,0));border-color:#3a2a24;border-left-color:var(--crimson)}
  .card-k{font-size:10px;color:#5d7085;flex:none;width:16px}
  .card.on .card-k{color:var(--flame)}
  .card-t{display:flex;flex-direction:column;gap:2px;min-width:0}
  .card-t strong{font-weight:600;font-size:13px;letter-spacing:.08em}
  .card-t em{font-style:normal;font-size:10px;color:#7f92a5;letter-spacing:.1em}

  /* ---- pills */
  .row{display:flex;flex-wrap:wrap;gap:5px}
  .pill{border:1px solid #2b3746;background:#0f1620;color:#b9c6d3;padding:5px 8px;font-size:11px;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
  .pill:hover{border-color:#41536a;color:var(--bone)}
  .pill.on{background:var(--bone);color:#12181f;border-color:var(--bone);font-weight:600}
  .pill:disabled{opacity:.45;cursor:not-allowed}
  .pill.tiny{padding:4px 6px;font-size:10px}
  .lab{font-size:10px;color:#7f92a5;letter-spacing:.16em;margin:9px 0 5px}
  .lab:first-child{margin-top:0}

  /* ---- stage */
  .main{min-width:0;display:flex;flex-direction:column;gap:10px}
  .frame{position:relative;border:1px solid #2b3746;background:#05080c;padding:8px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
  #stage-wrap{position:relative;line-height:0}
  #stage{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:transparent}
  .frame::before,.frame::after{content:"";position:absolute;width:10px;height:10px;border:1px solid #4d6480;pointer-events:none}
  .frame::before{left:4px;top:4px;border-right:0;border-bottom:0}
  .frame::after{right:4px;bottom:4px;border-left:0;border-top:0}
  .hud{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.18em;color:#d7e0ea;text-shadow:0 1px 0 #000;pointer-events:none}
  .hud b{color:var(--gold);font-weight:600}

  /* ---- transport */
  .transport{display:flex;align-items:center;gap:8px}
  .transport input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:#1d2836;border:1px solid #2b3746;outline:none}
  .transport input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:16px;background:var(--gold);border:0;cursor:pointer}
  .transport input[type=range]::-moz-range-thumb{width:10px;height:16px;background:var(--gold);border:0;cursor:pointer;border-radius:0}
  .btn{border:1px solid #2b3746;background:#0f1620;color:#c8d4e0;padding:6px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.06em;white-space:nowrap}
  .btn:hover{border-color:#41536a;color:var(--bone)}
  .btn.on{background:var(--bone);color:#12181f;border-color:var(--bone);font-weight:600}
  .btn.accent{border-color:#6a3c22;color:var(--gold)}
  .btn.accent:hover{background:rgba(230,46,0,.18);color:var(--bone)}
  .btn.hero{background:linear-gradient(180deg,#E62E00,#a81f00);border-color:#ff8a3d;color:#fff6ea;font-weight:600}
  .btn.hero:hover{background:linear-gradient(180deg,#ff5a24,#c22600)}
  .btn:disabled{opacity:.45;cursor:progress}

  /* ---- export */
  .export{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .export .hero{grid-column:1/-1}
  .note{color:#7f92a5;font-size:11px;line-height:1.6;margin:8px 0 0}
  .note code{color:#c8d4e0;background:#0f1620;border:1px solid #22303f;padding:0 3px}
  #grid{color:#9fb0c2;font-size:11px;margin-top:6px;line-height:1.5}


  /* ---- toast */
  #status{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#0f1620;border:1px solid #3a4a5e;border-left:3px solid var(--gold);color:var(--bone);padding:9px 14px;font-size:12px;pointer-events:none;z-index:9;letter-spacing:.06em}
  #status.on{opacity:1;transform:translate(-50%,0)}

  .kbd{display:inline-block;border:1px solid #2b3746;border-bottom-width:2px;padding:0 4px;color:#9fb0c2;font-size:10px}
  .layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .layers li{display:flex;gap:8px;align-items:center;font-size:11px;color:#b9c6d3}
  .layers i{width:10px;height:10px;flex:none;border:1px solid rgba(255,255,255,.16)}
  .layers em{font-style:normal;color:#7f92a5;font-size:10px;margin-left:auto;letter-spacing:.08em}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="sigil" viewBox="0 0 13 13" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="0" y="0" width="13" height="13" fill="#18222F"/>
        <rect x="1" y="1" width="11" height="11" fill="none" stroke="#FFD700"/>
        <rect x="3" y="3" width="7" height="7" fill="#E62E00"/>
        <rect x="5" y="5" width="3" height="3" fill="#FFD700"/>
        <rect x="6" y="0" width="1" height="13" fill="#18222F"/>
        <rect x="0" y="6" width="13" height="1" fill="#18222F"/>
        <rect x="1" y="1" width="2" height="2" fill="#2E9E8F"/>
        <rect x="10" y="10" width="2" height="2" fill="#2E9E8F"/>
      </svg>
      <div>
        <h1>山海焚天 <span>· 万象瑞火</span></h1>
        <p class="sub">HORIZONTAL METROIDVANIA BOSS · PURE VFX · 320×180</p>
      </div>
    </div>
    <div class="pal" aria-label="八色限定色板">
      <i style="background:#FFF8E7" title="骨白 #FFF8E7"></i>
      <i style="background:#FFD700" title="明黄 #FFD700"></i>
      <i style="background:#E62E00" title="朱红 #E62E00"></i>
      <i style="background:#FF6A00" title="烈焰橙 #FF6A00"></i>
      <i style="background:#7A1212" title="暗红 #7A1212"></i>
      <i style="background:#2E9E8F" title="青碧 #2E9E8F"></i>
      <i style="background:#16524B" title="深青 #16524B"></i>
      <i style="background:#18222F" title="深黛蓝 #18222F"></i>
    </div>
  </header>

  <aside>
    <div class="panel">
      <h2>技能 <b>01 — 04</b></h2>
      <div id="fxlist"></div>
      <div id="cuts-wrap">
        <div class="lab">连招段落</div>
        <div class="row" id="cuts"></div>
      </div>
    </div>

    <div class="panel">
      <h2>分支 <b>HIT / MISS</b></h2>
      <div id="branch-wrap"><div class="row" id="branch"></div></div>
      <div class="lab">背景</div>
      <div class="row" id="bg"></div>
      <div class="lab">帧率（手绘感）</div>
      <div class="row" id="fps"></div>
      <div class="lab">播放</div>
      <div class="row">
        <button class="btn on" id="loop" type="button">循环</button>
        <button class="btn on" id="shake" type="button">震屏</button>
      </div>
    </div>

    <div class="panel">
      <h2>导出 <b>SPRITE SHEET</b></h2>
      <div class="export">
        <button class="btn hero" id="exp-sheet" type="button">① 导出序列帧大图 PNG</button>
        <button class="btn" id="exp-frames" type="button">② 打包独立 PNG（ZIP）</button>
        <button class="btn" id="exp-frame" type="button">③ 导出当前帧</button>
      </div>
      <p class="note">大图与单帧均为<b>透明背景</b>，严格八色，无抗锯齿。每帧 <code>320×180</code>，网格从左到右、从上到下，第 0 帧在左上角。</p>
      <div id="grid">—</div>
    </div>

    <div class="panel">
      <h2>操作 <b>KEYS</b></h2>
      <div class="note" style="margin:0">
        <span class="kbd">Space</span> 播放/暂停　<span class="kbd">←</span><span class="kbd">→</span> 逐帧<br>
        <span class="kbd">R</span> 重放　<span class="kbd">1</span>–<span class="kbd">4</span> 切换技能
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="frame">
      <div id="stage-wrap">
        <canvas id="stage" width="320" height="180"></canvas>
        <div class="hud"><span id="hud-phase">—</span><span><b id="hud-time">0.00s</b>　<span id="hud-frame">FRAME 000</span></span></div>
      </div>
    </div>
    <div class="transport">
      <button class="btn on" id="play" type="button">❙❙ 暂停</button>
      <button class="btn" id="prev" type="button" title="上一帧">◀ 帧</button>
      <button class="btn" id="next" type="button" title="下一帧">帧 ▶</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="时间轴">
      <button class="btn" id="replay" type="button">↺ 重放</button>
    </div>
  </main>
</div>
<div id="status"></div>
